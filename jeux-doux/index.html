<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Les jeux doux de Nero</title>
<meta name="description" content="Jeux doux d'animation et de stimulation pour les personnes âgées, avec Nero le chat. Sans chronomètre, sans score, sans échec.">
<link rel="icon" href="../favicon.png">
<style>
:root{--bg:#fff6e8;--ink:#2b2118;--soft:#6b5644;--card:#ffffff;--accent:#e8742a;--accent2:#2f7fc8;--ok:#2e8b57;--line:#ecd9bf}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:26px;line-height:1.35;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;padding:18px 18px 28px}
.screen.show{display:flex}
h1{font-size:40px;text-align:center;margin-top:6px}
h1 span{color:var(--accent)}
.sub{color:var(--soft);text-align:center;font-size:24px;margin-top:4px}
canvas.mascot{display:block}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;max-width:820px;margin-top:16px}
@media (max-width:600px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:3px solid var(--line);border-radius:26px;min-height:150px;padding:18px;display:flex;align-items:center;gap:18px;text-align:left;box-shadow:0 6px 0 var(--line)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.tile .ic{font-size:64px;line-height:1}
.tile b{display:block;font-size:30px}
.tile small{display:block;font-size:21px;color:var(--soft)}
.settings{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.pill{background:var(--card);border:3px solid var(--line);border-radius:40px;padding:12px 22px;font-size:22px;font-weight:700;min-height:64px}
.pill.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.note{font-size:17px;color:var(--soft);text-align:center;margin-top:18px;max-width:700px}
.bar{width:100%;max-width:1000px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.home{background:var(--accent);color:#fff;font-weight:800;border-radius:22px;padding:14px 22px;min-height:76px;font-size:26px;box-shadow:0 5px 0 #b9561a;flex:none}
.home:active{transform:translateY(3px);box-shadow:0 2px 0 #b9561a}
.say{background:var(--card);border:3px solid var(--line);border-radius:22px;min-width:76px;min-height:76px;font-size:34px;flex:none}
.instr{flex:1;font-size:28px;font-weight:700;text-align:center}
.area{width:100%;max-width:1000px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.msg{font-size:30px;font-weight:800;min-height:44px;text-align:center;color:var(--ok)}
.msg.soft{color:var(--soft)}
/* paires */
.grid{display:grid;gap:14px;width:100%}
.mcard{aspect-ratio:1/1;border-radius:22px;background:var(--accent2);box-shadow:0 6px 0 #1f5a92;font-size:clamp(48px,10vw,96px);display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.mcard .f{display:none}
.mcard .b{font-size:clamp(40px,8vw,72px);font-weight:900;color:#fff}
.mcard.up{background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);color:var(--ink)}
.mcard.up .f{display:block}.mcard.up .b{display:none}
.mcard.done{background:#e6f6ec;border:4px solid #9fd8b3;box-shadow:none}
/* pots */
.pots{display:flex;gap:18px;justify-content:center;align-items:flex-end;width:100%;flex-wrap:nowrap}
.pot{position:relative;width:min(22vw,200px);height:min(30vw,240px);background:none;transition:transform 1.2s ease-in-out}
.pot .pp{position:absolute;bottom:0;left:0;right:0;font-size:min(20vw,170px);line-height:1;text-align:center}
.pot canvas{position:absolute;left:50%;transform:translateX(-50%);bottom:30%;pointer-events:none;transition:bottom .5s ease}
/* couleurs */
.item{font-size:150px;line-height:1;background:#fff;border:4px solid var(--line);border-radius:30px;padding:16px 30px}
.baskets{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.basket{min-width:200px;min-height:150px;border-radius:26px;font-size:30px;font-weight:800;color:#fff;padding:14px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.basket span{font-size:54px}
.basket:active{transform:translateY(3px)}
/* proverbes */
.prov{font-size:34px;font-weight:700;text-align:center;background:#fff;border:4px solid var(--line);border-radius:26px;padding:22px 26px;max-width:900px}
.choices{display:flex;flex-direction:column;gap:14px;width:100%;max-width:760px}
.choice{background:#fff;border:4px solid var(--line);border-radius:22px;min-height:86px;font-size:30px;font-weight:700;padding:12px 18px;box-shadow:0 5px 0 var(--line)}
.choice:active{transform:translateY(3px)}
.choice.no{opacity:.35;text-decoration:line-through}
.choice.yes{background:#e6f6ec;border-color:#5fbf86}
/* fin */
.big{font-size:44px;font-weight:800;text-align:center}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--accent2);color:#fff;font-weight:800;border-radius:22px;padding:18px 30px;min-height:86px;font-size:30px;box-shadow:0 5px 0 #1f5a92}
.btn.alt{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
@media (max-width:600px){body{font-size:22px}h1{font-size:32px}.instr{font-size:22px}.home{font-size:20px;padding:10px 14px;min-height:64px}.say{min-width:64px;min-height:64px}.item{font-size:110px}.basket{min-width:140px}.prov{font-size:26px}.choice{font-size:24px}}
</style>
</head>
<body>

<section id="menu" class="screen show">
  <canvas class="mascot" id="mHome" width="220" height="200"></canvas>
  <h1>Les jeux doux de <span>Nero</span></h1>
  <p class="sub">Prenez votre temps : ici, on ne perd jamais.</p>
  <div class="tiles">
    <button class="tile" data-go="pairs"><span class="ic">🃏</span><span><b>Les paires</b><small>Retrouver les images identiques</small></span></button>
    <button class="tile" data-go="pots"><span class="ic">🪴</span><span><b>Où est Nero ?</b><small>Suivre Nero des yeux</small></span></button>
    <button class="tile" data-go="colors"><span class="ic">🧺</span><span><b>Les couleurs</b><small>Ranger les fruits dans les paniers</small></span></button>
    <button class="tile" data-go="prov"><span class="ic">📜</span><span><b>Les proverbes</b><small>Compléter les dictons d'autrefois</small></span></button>
  </div>
  <div class="settings">
    <button class="pill" id="lvEasy">🌱 Facile</button>
    <button class="pill" id="lvMid">🌳 Moyen</button>
    <button class="pill" id="voiceBtn">🗣️ Voix</button>
    <button class="pill" id="soundBtn">🔔 Sons</button>
  </div>
  <p class="note">Activité de loisir et d'animation, sans chronomètre ni score. Elle ne remplace pas un soin ni un avis médical. Aucune donnée personnelle n'est collectée. © Nero Studio</p>
</section>

<section id="play" class="screen">
  <div class="bar">
    <button class="home" id="homeBtn">🏠 Accueil</button>
    <div class="instr" id="instr"></div>
    <button class="say" id="sayBtn" aria-label="Relire la consigne">🔊</button>
  </div>
  <div class="area" id="area"></div>
</section>

<section id="end" class="screen">
  <div class="area">
    <canvas class="mascot" id="mEnd" width="260" height="230"></canvas>
    <div class="big" id="endTxt">Bravo !</div>
    <p class="sub" id="endSub"></p>
    <div class="row">
      <button class="btn" id="againBtn">🔁 Encore</button>
      <button class="btn alt" id="endHome">🏠 Accueil</button>
    </div>
  </div>
</section>

<script>
function drawNero(c,x,y,R,o){
  o=o||{};const t=performance.now()/1000;
  c.save();c.translate(x,y);
  if(o.dir<0)c.scale(-1,1);
  // ombre
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(0,R*1.42,R*.85,R*.22,0,0,7);c.fill();
  // queue noire
  const sw=Math.sin(t*(o.run?9:3))*.35;
  c.strokeStyle='#15151b';c.lineCap='round';c.lineWidth=R*.26;
  c.beginPath();c.moveTo(R*.5,R*1.05);c.quadraticCurveTo(R*1.35,R*(.9+sw*.3),R*(1.15+sw*.4),R*(.15+sw));c.stroke();
  if(o.costume==='cape'){const w=Math.sin(t*4)*R*.08;c.fillStyle='#c62f3a';c.beginPath();c.moveTo(-R*.5,R*.35);c.quadraticCurveTo(-R*1.2,R*.9,-R*1.02+w,R*1.45);c.lineTo(R*1.02+w,R*1.45);c.quadraticCurveTo(R*1.2,R*.9,R*.5,R*.35);c.closePath();c.fill();c.fillStyle='#9e2230';c.fillRect(-R*1.02+w,R*1.38,R*2.04,R*.07);}
  // corps
  c.fillStyle='#15151b';c.beginPath();c.ellipse(0,R*.85,R*.78,R*.62,0,0,7);c.fill();     // dos noir
  c.fillStyle='#fbfbfd';c.beginPath();c.ellipse(0,R*.95,R*.56,R*.55,0,0,7);c.fill();    // poitrail blanc
  // pattes blanches
  const step=o.run?Math.sin(t*16)*R*.08:0;
  c.fillStyle='#fbfbfd';c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;
  c.beginPath();c.ellipse(-R*.3,R*1.38+step,R*.2,R*.13,0,0,7);c.fill();c.stroke();
  c.beginPath();c.ellipse(R*.3,R*1.38-step,R*.2,R*.13,0,0,7);c.fill();c.stroke();
  // oreilles
  const ear=(s)=>{c.fillStyle='#15151b';c.beginPath();c.moveTo(s*R*.78,-R*.45);c.lineTo(s*R*.72,-R*1.28);c.lineTo(s*R*.2,-R*.82);c.closePath();c.fill();
    c.fillStyle='#e9a0a6';c.beginPath();c.moveTo(s*R*.66,-R*.6);c.lineTo(s*R*.66,-R*1.08);c.lineTo(s*R*.36,-R*.8);c.closePath();c.fill();};
  ear(-1);ear(1);
  // tête
  c.save();c.beginPath();c.ellipse(0,-R*.2,R*.9,R*.8,0,0,7);c.clip();
  c.fillStyle='#fbfbfd';c.fillRect(-R,-R*1.1,R*2,R*2);
  c.fillStyle='#15151b';c.fillRect(-R,-R*1.1,R*2,R*.95);                                  // calotte noire
  c.beginPath();c.ellipse(-R*.62,-R*.15,R*.36,R*.42,0,0,7);c.fill();                       // joues noires
  c.beginPath();c.ellipse(R*.66,-R*.12,R*.3,R*.4,0,0,7);c.fill();
  c.fillStyle='#fbfbfd';c.beginPath();                                                     // liseré blanc en V
  c.moveTo(-R*.08,-R*1.05);c.lineTo(R*.08,-R*1.05);c.quadraticCurveTo(R*.18,-R*.45,R*.5,-R*.05);
  c.lineTo(-R*.5,-R*.05);c.quadraticCurveTo(-R*.18,-R*.45,-R*.08,-R*1.05);c.fill();
  c.restore();
  // yeux
  const eye=(ex)=>{
    if(o.wet){const k=ex<0?1:-1;c.strokeStyle='#f4f4f8';c.lineWidth=R*.08;c.lineJoin='round';c.beginPath();c.moveTo(ex-k*R*.12,-R*.33);c.lineTo(ex+k*R*.1,-R*.25);c.lineTo(ex-k*R*.12,-R*.17);c.stroke();return;}
    c.fillStyle='#d6cf6a';c.beginPath();c.ellipse(ex,-R*.25,R*.17,R*.15,0,0,7);c.fill();
    c.strokeStyle='#5d5a2a';c.lineWidth=1;c.stroke();
    c.fillStyle='#0d0d10';c.beginPath();c.ellipse(ex+(o.look||0)*R*.04,-R*.25,R*(o.hunt?.12:.07),R*.13,0,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(ex-R*.05,-R*.31,R*.035,0,7);c.fill();
  };
  eye(-R*.36);eye(R*.36);
  // nez rose avec la tache noire
  c.fillStyle='#e8b4b8';c.beginPath();c.moveTo(-R*.09,R*.02);c.lineTo(R*.09,R*.02);c.lineTo(0,R*.13);c.closePath();c.fill();
  c.fillStyle='#15151b';c.beginPath();c.ellipse(R*.02,R*.03,R*.08,R*.05,0,0,7);c.fill();
  // bouche + barbiche noire
  c.strokeStyle='#15151b';c.lineWidth=R*.04;c.beginPath();c.moveTo(0,R*.13);c.quadraticCurveTo(-R*.07,R*.22,-R*.15,R*.18);c.moveTo(0,R*.13);c.quadraticCurveTo(R*.07,R*.22,R*.15,R*.18);c.stroke();
  c.fillStyle='#15151b';c.beginPath();c.ellipse(0,R*.3,R*.17,R*.08,0,0,7);c.fill();
  // moustaches
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=Math.max(1,R*.025);c.beginPath();
  for(const s of[-1,1])for(let i=0;i<3;i++){c.moveTo(s*R*.25,R*.1+i*R*.05);c.lineTo(s*R*1.05,R*(.0+i*.12));}
  c.stroke();c.strokeStyle='rgba(0,0,0,.18)';c.stroke();
  if(o.costume==='bow'){c.fillStyle='#d6283a';c.beginPath();c.moveTo(0,R*.62);c.lineTo(-R*.4,R*.44);c.lineTo(-R*.4,R*.8);c.closePath();c.moveTo(0,R*.62);c.lineTo(R*.4,R*.44);c.lineTo(R*.4,R*.8);c.closePath();c.fill();c.fillStyle='#a01a2a';c.beginPath();c.arc(0,R*.62,R*.11,0,7);c.fill();}
  if(o.costume==='cape'){c.fillStyle='#f5c518';c.beginPath();c.arc(-R*.34,R*.6,R*.09,0,7);c.arc(R*.34,R*.6,R*.09,0,7);c.fill();}
  if(o.costume==='crown'){c.fillStyle='#f5c518';c.strokeStyle='#b8860b';c.lineWidth=R*.04;c.beginPath();c.moveTo(-R*.42,-R*.88);c.lineTo(-R*.5,-R*1.34);c.lineTo(-R*.22,-R*1.1);c.lineTo(0,-R*1.44);c.lineTo(R*.22,-R*1.1);c.lineTo(R*.5,-R*1.34);c.lineTo(R*.42,-R*.88);c.closePath();c.fill();c.stroke();
    c.fillStyle='#e8433a';c.beginPath();c.arc(0,-R*1.0,R*.08,0,7);c.fill();c.fillStyle='#3aa0e8';c.beginPath();c.arc(-R*.26,-R*.98,R*.055,0,7);c.fill();c.beginPath();c.arc(R*.26,-R*.98,R*.055,0,7);c.fill();}
  // mouillé
  if(o.wet){
    c.fillStyle='rgba(95,179,240,.35)';c.beginPath();c.ellipse(0,R*1.45,R*1.1,R*.28,0,0,7);c.fill();
    for(let i=0;i<4;i++){const dx=(i-1.5)*R*.45,dy=((t*1.6+i*.3)%1)*R*1.2;c.fillStyle='#5fb3f0';c.beginPath();c.ellipse(dx,-R*.2+dy,R*.06,R*.1,0,0,7);c.fill();}
  }
  if(o.umbrella){
    c.save();c.translate(R*.1,-R*1.5);
    c.strokeStyle='#4a3b2a';c.lineWidth=R*.07;c.beginPath();c.moveTo(0,0);c.lineTo(0,R*1.0);c.stroke();
    c.fillStyle='#e8433a';c.beginPath();c.moveTo(-R*1.25,0);c.quadraticCurveTo(0,-R*1.15,R*1.25,0);
    for(let i=4;i>=0;i--){const x0=-R*1.25+i*R*.5;c.quadraticCurveTo(x0+R*.25,-R*.2,x0,0);}c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.moveTo(-R*.3,-R*.05);c.quadraticCurveTo(0,-R*1.05,R*.25,-R*.05);c.fill();
    c.restore();
  }
  c.restore();
}
function drawMouse(c,x,y,r,dir,gold,ph){
  c.save();c.translate(x,y);if(dir>0)c.scale(-1,1);
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,r*.6,r*1.1,r*.28,0,0,7);c.fill();
  c.strokeStyle=gold?'#c99a12':'#b98a8e';c.lineWidth=Math.max(1.5,r*.12);c.lineCap='round';
  c.beginPath();c.moveTo(r*.9,r*.1);c.quadraticCurveTo(r*1.6,r*(-.4+Math.sin(ph)*.4),r*2.1,r*.05);c.stroke();
  c.fillStyle=gold?'#f2c230':'#9a9aa3';c.beginPath();c.ellipse(0,0,r*1.05,r*.68,0,0,7);c.fill();
  c.beginPath();c.ellipse(-r*.85,-r*.05,r*.5,r*.42,0,0,7);c.fill();
  c.fillStyle=gold?'#ffe28a':'#e9a0a6';c.beginPath();c.arc(-r*.6,-r*.55,r*.32,0,7);c.fill();
  c.fillStyle='#e9a0a6';c.beginPath();c.arc(-r*1.32,-r*.02,r*.12,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(-r*.95,-r*.15,r*.09,0,7);c.fill();
  if(gold){c.fillStyle='#fff';c.globalAlpha=.6+.4*Math.sin(ph*2);c.beginPath();c.arc(r*.2,-r*.3,r*.15,0,7);c.fill();c.globalAlpha=1;}
  c.restore();
}


</script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const S={level:store.get('doux_level','easy'),voice:store.get('doux_voice',true),sound:store.get('doux_sound',true)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const PRAISE=['Bravo !','Très bien !','Magnifique !','Parfait !','Excellent !','Formidable !'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- voix et sons ---------- */
let frVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();frVoice=v.find(x=>/^fr(-|_)FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){if(!S.voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s,.!?'’…:-]/gu,''));u.lang='fr-FR';u.rate=.85;if(frVoice)u.voice=frVoice;speechSynthesis.speak(u);}catch(e){}}
let ac=null;
function chime(ok){if(!S.sound)return;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const notes=ok?[523,659,784]:[392];const t0=ac.currentTime;
  notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*.12);g.gain.linearRampToValueAtTime(.12,t0+i*.12+.03);g.gain.exponentialRampToValueAtTime(.001,t0+i*.12+.6);o.connect(g);g.connect(ac.destination);o.start(t0+i*.12);o.stop(t0+i*.12+.65);});}catch(e){}}

/* ---------- mascotte ---------- */
const mascots=[];
function mascot(cv,R,opts){const c=cv.getContext('2d');const m={cv,c,R,opts:opts||{},hop:0};mascots.push(m);return m;}
function drawMascots(){for(const m of mascots){if(!m.cv.offsetParent)continue;const {c,cv,R}=m;c.clearRect(0,0,cv.width,cv.height);
  const y=cv.height-R*1.6-(m.hop>0?Math.sin(m.hop*Math.PI)*R*.5:0);if(m.hop>0)m.hop=Math.max(0,m.hop-.025);
  try{drawNero(c,cv.width/2,y,R,m.opts);}catch(e){}}
  requestAnimationFrame(drawMascots);}
const homeM=mascot($('mHome'),55),endM=mascot($('mEnd'),65,{costume:'crown'});
requestAnimationFrame(drawMascots);

/* ---------- navigation ---------- */
function show(id){['menu','play','end'].forEach(s=>$(s).classList.toggle('show',s===id));window.scrollTo(0,0);}
let current=null,instrText='';
function setInstr(t){instrText=t;$('instr').textContent=t;say(t);}
function start(name){current=name;show('play');const a=$('area');a.innerHTML='';GAMES[name](a);}
function finish(sub){show('end');$('endTxt').textContent=praise();$('endSub').textContent=sub||'';endM.hop=1;chime(true);say($('endTxt').textContent+' '+(sub||''));}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.go)));
$('homeBtn').onclick=$('endHome').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}clearTimers();show('menu');};
$('againBtn').onclick=()=>start(current);
$('sayBtn').onclick=()=>{const v=S.voice;S.voice=true;say(instrText);S.voice=v;};
function refreshSettings(){$('lvEasy').classList.toggle('on',S.level==='easy');$('lvMid').classList.toggle('on',S.level==='mid');
  $('voiceBtn').classList.toggle('on',S.voice);$('soundBtn').classList.toggle('on',S.sound);
  $('voiceBtn').textContent=(S.voice?'🗣️ Voix : oui':'🗣️ Voix : non');$('soundBtn').textContent=(S.sound?'🔔 Sons : oui':'🔕 Sons : non');}
$('lvEasy').onclick=()=>{S.level='easy';store.set('doux_level','easy');refreshSettings();};
$('lvMid').onclick=()=>{S.level='mid';store.set('doux_level','mid');refreshSettings();};
$('voiceBtn').onclick=()=>{S.voice=!S.voice;store.set('doux_voice',S.voice);refreshSettings();if(S.voice)say('La voix est activée.');else{try{speechSynthesis.cancel();}catch(e){}}};
$('soundBtn').onclick=()=>{S.sound=!S.sound;store.set('doux_sound',S.sound);refreshSettings();chime(true);};
refreshSettings();
let timers=[];const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t;};
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function msgEl(){const m=document.createElement('div');m.className='msg';return m;}

/* ---------- jeux ---------- */
const GAMES={
 /* 1. Les paires */
 pairs(a){
  const pool=['🍎','🌻','🐟','🧶','☕','🍇','🌷','🥖','🐦','🎈'];
  const n=S.level==='easy'?3:6;const cols=S.level==='easy'?3:4;
  setInstr('Touchez deux cartes pour retrouver les images identiques.');
  const icons=shuffle(pool).slice(0,n);const deck=shuffle(icons.concat(icons));
  const g=document.createElement('div');g.className='grid';g.style.gridTemplateColumns='repeat('+cols+',1fr)';g.style.maxWidth=(cols*190)+'px';
  const m=msgEl();a.appendChild(m);a.appendChild(g);
  let open=[],found=0,lock=false;
  deck.forEach(ic=>{const c=document.createElement('button');c.className='mcard';c.innerHTML='<span class="f">'+ic+'</span><span class="b">?</span>';c.dataset.ic=ic;
    c.onclick=()=>{if(lock||c.classList.contains('up')||c.classList.contains('done'))return;c.classList.add('up');open.push(c);
      if(open.length===2){lock=true;const [x,y]=open;
        if(x.dataset.ic===y.dataset.ic){later(()=>{x.classList.add('done');y.classList.add('done');open=[];lock=false;found++;m.className='msg';m.textContent=praise();chime(true);
          if(found===n)later(()=>finish('Vous avez retrouvé toutes les paires.'),900);},450);}
        else{m.className='msg soft';m.textContent='Ce ne sont pas les mêmes. Regardez bien…';later(()=>{x.classList.remove('up');y.classList.remove('up');open=[];lock=false;m.textContent='';},1800);}}};
    g.appendChild(c);});
 },
 /* 2. Où est Nero ? */
 pots(a){
  const nPots=S.level==='easy'?3:4,rounds=4;let round=0;
  const m=msgEl();a.appendChild(m);
  const row=document.createElement('div');row.className='pots';a.appendChild(row);
  function next(){
    row.innerHTML='';m.textContent='';round++;
    const target=Math.floor(Math.random()*nPots);const pots=[];
    for(let i=0;i<nPots;i++){const p=document.createElement('button');p.className='pot';p.innerHTML='<span class="pp">🪴</span>';row.appendChild(p);pots.push(p);}
    const cv=document.createElement('canvas');cv.width=160;cv.height=150;pots[target].appendChild(cv);const nm=mascot(cv,40);
    cv.style.bottom='62%';
    setInstr('Regardez bien : Nero va se cacher derrière un pot.');
    let ready=false;
    later(()=>{cv.style.bottom='18%';},1800);
    later(()=>{cv.style.visibility='hidden';
      if(S.level==='mid'){// échange lent de deux pots
        const i=target,j=(target+1+Math.floor(Math.random()*(nPots-1)))%nPots;const dx=pots[j].getBoundingClientRect().left-pots[i].getBoundingClientRect().left;
        pots[i].style.transform='translateX('+dx+'px)';pots[j].style.transform='translateX('+(-dx)+'px)';
        later(()=>{ready=true;setInstr('Les pots ont bougé ! Touchez le pot où se cache Nero.');},1500);}
      else{ready=true;setInstr('Touchez le pot où se cache Nero.');}},2700);
    pots.forEach((p,i)=>p.onclick=()=>{if(!ready)return;
      if(i===target){ready=false;cv.style.visibility='visible';cv.style.bottom='62%';nm.hop=1;m.className='msg';m.textContent='Coucou ! '+praise();chime(true);
        later(()=>{if(round>=rounds)finish('Vous avez retrouvé Nero à chaque fois.');else next();},2200);}
      else{p.style.opacity='.4';p.disabled=true;m.className='msg soft';m.textContent='Pas ici… Essayez un autre pot.';say('Pas ici. Essayez un autre pot.');}});
  }
  next();
 },
 /* 3. Les couleurs */
 colors(a){
  const B={rouge:{c:'#d64541',l:'Rouge',e:'🧺',items:['🍎','🍓','🍒','🍅']},jaune:{c:'#e0a800',l:'Jaune',e:'🧺',items:['🍌','🍋','🌻','🧀']},vert:{c:'#2e8b57',l:'Vert',e:'🧺',items:['🍏','🥦','🥒','🍐']}};
  const keys=S.level==='easy'?['rouge','jaune']:['rouge','jaune','vert'];
  let seq=[];keys.forEach(k=>B[k].items.slice(0,S.level==='easy'?3:2).forEach(e=>seq.push({e,k})));seq=shuffle(seq);
  setInstr('Rangez chaque fruit dans le panier de sa couleur.');
  const m=msgEl();const it=document.createElement('div');it.className='item';const bs=document.createElement('div');bs.className='baskets';
  a.appendChild(m);a.appendChild(it);a.appendChild(bs);let idx=0,lock=false;
  keys.forEach(k=>{const b=document.createElement('button');b.className='basket';b.style.background=B[k].c;b.innerHTML='<span>'+B[k].e+'</span>'+B[k].l;
    b.onclick=()=>{if(lock)return;const cur=seq[idx];
      if(cur.k===k){lock=true;m.className='msg';m.textContent=praise();chime(true);idx++;
        later(()=>{lock=false;m.textContent='';if(idx>=seq.length)finish('Tous les fruits sont bien rangés.');else it.textContent=seq[idx].e;},1100);}
      else{m.className='msg soft';m.textContent='Presque ! Regardez bien la couleur.';say('Presque ! Regardez bien la couleur.');}};
    bs.appendChild(b);});
  it.textContent=seq[0].e;
 },
 /* 4. Les proverbes */
 prov(a){
  const P=[
   ['Petit à petit, l\'oiseau fait…','son nid',['sa route','son chant']],
   ['Qui vivra…','verra',['dormira','chantera']],
   ['Après la pluie, le…','beau temps',['vent','brouillard']],
   ['Il ne faut pas vendre la peau de l\'ours avant de…','l\'avoir tué',['l\'avoir vu','l\'avoir lavé']],
   ['Quand le chat n\'est pas là, les souris…','dansent',['dorment','mangent']],
   ['Pierre qui roule n\'amasse pas…','mousse',['poussière','fortune']],
   ['L\'habit ne fait pas le…','moine',['tailleur','roi']],
   ['Rien ne sert de courir, il faut partir à…','point',['temps','pied']],
   ['Les petits ruisseaux font les grandes…','rivières',['mers','fontaines']],
   ['Chat échaudé craint l\'eau…','froide',['chaude','salée']],
   ['À cheval donné, on ne regarde pas les…','dents',['sabots','yeux']],
   ['Une hirondelle ne fait pas le…','printemps',['nid','été']],
   ['Tel père, tel…','fils',['frère','cousin']],
   ['Mieux vaut tard que…','jamais',['tôt','demain']],
   ['La nuit porte…','conseil',['bonheur','chance']]
  ];
  const nQ=5;const qs=shuffle(P).slice(0,nQ);let qi=0;
  const m=msgEl();const pv=document.createElement('div');pv.className='prov';const ch=document.createElement('div');ch.className='choices';
  a.appendChild(m);a.appendChild(pv);a.appendChild(ch);
  function ask(){const [start,good,bad]=qs[qi];m.textContent='';pv.textContent=start;ch.innerHTML='';
    const opts=shuffle([good].concat(S.level==='easy'?[bad[0]]:bad));
    setInstr('Complétez le proverbe.');later(()=>say(start),1600);
    let lock=false;
    opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;
      b.onclick=()=>{if(lock||b.classList.contains('no'))return;
        if(o===good){lock=true;b.classList.add('yes');pv.textContent=start.replace('…',' '+good+' !');m.className='msg';m.textContent=praise();chime(true);say(pv.textContent);qi++;
          later(()=>{if(qi>=nQ)finish('Vous connaissez bien vos proverbes.');else ask();},2600);}
        else{b.classList.add('no');m.className='msg soft';m.textContent='Presque ! Essayez une autre réponse.';say('Presque ! Essayez une autre réponse.');}};
      ch.appendChild(b);});}
  ask();
 }
};
window.__DOUX={GAMES,S,start};
})();
</script>
